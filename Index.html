
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.lbl { font-size: 11px; color: var(--color-text-secondary); min-width: 46px; font-family: var(--font-sans); }
.val { font-size: 11px; font-weight: 500; color: var(--color-text-primary); min-width: 30px; text-align: right; font-family: var(--font-sans); }
.stat { background: var(--color-background-secondary); border-radius: 6px; padding: 5px 8px; flex: 1; text-align: center; }
.sl { font-size: 10px; color: var(--color-text-secondary); font-family: var(--font-sans); }
.sv { font-size: 15px; font-weight: 500; color: var(--color-text-primary); font-family: var(--font-sans); }
</style>

<div style="display:flex;gap:8px;align-items:flex-start">

  <canvas id="gc" width="320" height="260" style="border-radius:8px;border:0.5px solid rgba(0,0,0,0.1);flex-shrink:0;width:320px;height:260px"></canvas>

  <div style="flex:1;min-width:0">
    <div class="row">
      <span class="lbl">Солнце</span>
      <input type="range" min="0" max="100" value="70" id="sl-sun" step="1" style="flex:1">
      <span class="val" id="v-sun">70%</span>
    </div>
    <div class="row">
      <span class="lbl">Полив</span>
      <input type="range" min="0" max="100" value="60" id="sl-water" step="1" style="flex:1">
      <span class="val" id="v-water">60%</span>
    </div>
    <div class="row" style="margin-bottom:10px">
      <span class="lbl">Ветер</span>
      <input type="range" min="0" max="100" value="30" id="sl-wind" step="1" style="flex:1">
      <span class="val" id="v-wind">30%</span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px">
      <div class="stat"><div class="sl">День</div><div class="sv" id="s-day">1</div></div>
      <div class="stat"><div class="sl">Высота</div><div class="sv" id="s-height">0 см</div></div>
      <div class="stat"><div class="sl">Здоровье</div><div class="sv" id="s-health">100%</div></div>
      <div class="stat"><div class="sl">Стадия</div><div class="sv" style="font-size:12px" id="s-stage">Семя</div></div>
    </div>

    <button id="btn-reset" style="width:100%;font-size:11px;padding:5px 0">Сбросить</button>
  </div>
</div>

<script>
const cv = document.getElementById('gc');
const ctx = cv.getContext('2d');
const W = 320, H = 260;
const GY = H * 0.76;

let sun = 0.7, water = 0.6, wind = 0.3;
let day = 0, health = 1, t = 0;
let blades = [], rain = [], rays = [];

function rng(s, i) { return ((Math.sin(s * 127.1 + i * 311.7) * 43758.5) % 1 + 1) % 1; }

function initBlades() {
  blades = [];
  for (let i = 0; i < 42; i++) {
    blades.push({
      x: 10 + (i / 42) * (W - 20) + (rng(i,1)-.5)*12,
      maxH: 30 + rng(i,2)*55,
      h: 0,
      lean: (rng(i,4)-.5)*0.35,
      phase: rng(i,5)*Math.PI*2,
      w: 2+rng(i,6)*1.5,
      delay: rng(i,7)*7,
    });
  }
}

function initRain() {
  rain = Array.from({length:35}, () => ({
    x: Math.random()*W, y: Math.random()*GY,
    spd: 3+Math.random()*3, len: 6+Math.random()*8
  }));
}

function initRays() {
  rays = Array.from({length:7}, (_,i) => ({
    a: (i/7)*Math.PI*2, ph: Math.random()*Math.PI*2
  }));
}

function growRate() {
  const s=sun, w=water;
  const stress=(s>.9&&w<.2)?.3:1;
  return (s*.5+w*.5)*stress*.4;
}

function skyColor() {
  const b = 0.7 + sun*0.3;
  return `rgb(${Math.round(100+b*100)},${Math.round(140+b*80)},${Math.round(180+b*55)})`;
}

function bladeColor(b) {
  if (health<.3||(sun>.9&&water<.15)) return '#c8a84b';
  const p = b.h/b.maxH;
  return p<.3?'#a8d87a':p<.7?'#5c9e2a':'#3b6d11';
}

function draw() {
  ctx.fillStyle = skyColor();
  ctx.fillRect(0,0,W,GY);

  const sx=45+sun*55, sy=28+sun*15, sr=14+sun*7, sa=0.2+sun*.6;
  ctx.fillStyle=`rgba(255,220,50,${sa*.25})`; ctx.beginPath(); ctx.arc(sx,sy,sr*1.7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`rgba(255,210,50,${sa})`; ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
  rays.forEach(r => {
    const pulse=Math.sin(t*.04+r.ph)*.3+.7, len=(6+sun*8)*pulse, a=r.a+t*.005;
    ctx.strokeStyle=`rgba(255,200,40,${sa*.5*pulse})`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(sx+Math.cos(a)*(sr+3),sy+Math.sin(a)*(sr+3));
    ctx.lineTo(sx+Math.cos(a)*(sr+len),sy+Math.sin(a)*(sr+len)); ctx.stroke();
  });

  const ca = Math.max(0,1-sun*1.2);
  if (ca>.05) {
    [{x:100+Math.sin(t*.003)*12,y:35,w:50,h:16},{x:220+Math.sin(t*.002+1)*10,y:25,w:40,h:13}].forEach(c=>{
      ctx.fillStyle=`rgba(240,248,255,${ca*.8})`;
      ctx.beginPath(); ctx.ellipse(c.x,c.y,c.w,c.h,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c.x-c.w*.3,c.y+3,c.w*.5,c.h*.7,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c.x+c.w*.3,c.y+4,c.w*.45,c.h*.65,0,0,Math.PI*2); ctx.fill();
    });
  }

  const ri = Math.max(0,water-.3)/.7;
  if (ri>.05) {
    ctx.strokeStyle=`rgba(120,180,255,${ri*.5})`; ctx.lineWidth=.8;
    rain.forEach(d => {
      ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-1,d.y+d.len); ctx.stroke();
      d.y+=d.spd*ri*1.5; d.x-=wind*1.2;
      if(d.y>GY){d.y=-15;d.x=Math.random()*W;}
      if(d.x<0)d.x=W; if(d.x>W)d.x=0;
    });
  }

  ctx.fillStyle='#8B6340'; ctx.fillRect(0,GY,W,12);
  if(water>.3){ctx.fillStyle=`rgba(50,25,5,${(water-.3)*.55})`; ctx.fillRect(0,GY,W,12);}
  ctx.fillStyle='#5C3D1E'; ctx.fillRect(0,GY+12,W,H-GY-12);

  blades.sort((a,b)=>a.x-b.x).forEach(b => {
    if(b.h<1)return;
    const sw=wind*8*Math.sin(t*.05+b.phase), lx=b.lean*b.h+sw*(b.h/b.maxH);
    const col=bladeColor(b);
    ctx.fillStyle=col; ctx.strokeStyle=col==='#c8a84b'?'#a07820':'#2a5010'; ctx.lineWidth=.5;
    ctx.beginPath();
    ctx.moveTo(b.x-b.w/2,GY);
    ctx.quadraticCurveTo(b.x+lx*.4,GY-b.h*.5,b.x+lx,GY-b.h);
    ctx.quadraticCurveTo(b.x+lx*.4,GY-b.h*.5,b.x+b.w/2,GY);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });

  if(wind>.5&&day>8){
    for(let i=0;i<4;i++){
      const px=((t*wind*2+i*90)%(W+30))-15, py=GY-10-(i*30)%50;
      ctx.fillStyle=`rgba(100,160,40,${Math.sin(t*.07+i)*.3+.3})`;
      ctx.beginPath(); ctx.ellipse(px,py,2.5,1.2,Math.PI*.3,0,Math.PI*2); ctx.fill();
    }
  }

  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.roundRect(W-60,8,52,20,4); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.88)'; ctx.font='500 11px sans-serif'; ctx.textAlign='right';
  ctx.fillText('День '+Math.floor(day),W-10,22); ctx.textAlign='left';
}

function update() {
  day+=.016*(.5+growRate()); t++;
  health=Math.min(1,Math.max(0,health+(growRate()-.15)*.005));
  blades.forEach(b=>{
    if(day<b.delay)return;
    const tgt=b.maxH*Math.min(1,(day-b.delay)/22)*health;
    b.h+=(tgt-b.h)*.035;
  });
}

function getStage(){
  if(day<2)return'Семя'; if(day<5)return'Росток';
  if(day<14)return'Молодой'; if(day<28)return'Зрелый'; return'Высокий';
}

function updateUI(){
  const avg=blades.reduce((s,b)=>s+b.h,0)/blades.length;
  document.getElementById('s-day').textContent=Math.floor(day);
  document.getElementById('s-height').textContent=Math.round(avg/3)+' см';
  document.getElementById('s-health').textContent=Math.round(health*100)+'%';
  document.getElementById('s-stage').textContent=getStage();
}

function loop(){ draw(); update(); updateUI(); requestAnimationFrame(loop); }

function readSliders(){
  sun=parseInt(document.getElementById('sl-sun').value)/100;
  water=parseInt(document.getElementById('sl-water').value)/100;
  wind=parseInt(document.getElementById('sl-wind').value)/100;
  document.getElementById('v-sun').textContent=Math.round(sun*100)+'%';
  document.getElementById('v-water').textContent=Math.round(water*100)+'%';
  document.getElementById('v-wind').textContent=Math.round(wind*100)+'%';
}

['sl-sun','sl-water','sl-wind'].forEach(id=>document.getElementById(id).addEventListener('input',readSliders));
document.getElementById('btn-reset').addEventListener('click',()=>{
  day=0;health=1;initBlades();
  document.getElementById('sl-sun').value=70;
  document.getElementById('sl-water').value=60;
  document.getElementById('sl-wind').value=30;
  readSliders();
});

initBlades(); initRain(); initRays(); readSliders(); loop();
</script>
